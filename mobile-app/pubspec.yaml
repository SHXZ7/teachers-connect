name: edunova
description: EduNova - Empowering rural education through innovative teaching resources and AI-powered assistance.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_svg: ^1.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.14
  google_fonts: ^5.0.0
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/app_icon.svg
    - assets/icons/home.svg
    - assets/icons/resources.svg
    - assets/icons/ai.svg
    - assets/icons/lang.svg
    - assets/icons/community.svg
    - assets/icons/offline.svg
    - assets/icons/profile.svg
    - assets/icons/settings.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FF6B35"
    theme_color: "#FF6B35"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"
